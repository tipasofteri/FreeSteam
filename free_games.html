<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесплатные игры - FreeSteam</title>
    <link rel="icon" href="icosteamfree.ico" type="image/x-icon">
    <link rel="shortcut icon" href="icosteamfree.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #66c0f4;
            --bg-dark: #1b2838;
            --bg-darker: #171a21;
            --text-primary: #e9e9e9;
            --border-color: #2a3f5a;
        }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        .game-card {
            background: rgba(42, 63, 90, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            overflow: hidden;
            height: 100%;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: var(--primary);
        }
        
        .game-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }
        
        .game-title {
            color: var(--primary);
            font-size: 1rem;
            font-weight: 600;
            margin: 1rem 1rem 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .game-price {
            color: #a1cd44;
            font-weight: 700;
            padding: 0 1rem 1rem;
        }
        
        .btn-steam {
            background: linear-gradient(135deg, #1b2838 0%, #2a3f5a 100%);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            border-radius: 0 0 6px 6px;
            padding: 0.5rem;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        
        .btn-steam:hover {
            background: var(--primary);
            color: #1b2838;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(23, 26, 33, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            max-width: 90vw;
            max-height: 90vh;
            background: url('loading1.gif') center/contain no-repeat;
            background-color: #1b2838;
            z-index: 10000;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }
        

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .page-header {
            background: linear-gradient(135deg, #1b2838 0%, #2a3f5a 100%);
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        #gamesContainer {
            min-height: 60vh; /* контейнер занимает хотя бы 60% высоты экрана */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .animated-emoji {
            font-size: 5rem;
            display: inline-block;
            position: relative;
            animation: float 15s ease-in-out infinite;
        }

        @keyframes float {
            0% { 
                transform: translate(0, 0) rotate(0deg);
                filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.3));
            }
            25% { 
                transform: translate(50px, -30px) rotate(5deg);
                filter: drop-shadow(5px 10px 8px rgba(0, 0, 0, 0.2));
            }
            50% { 
                transform: translate(30px, 20px) rotate(-3deg);
                filter: drop-shadow(-5px 5px 6px rgba(0, 0, 0, 0.25));
            }
            75% { 
                transform: translate(-40px, -10px) rotate(4deg);
                filter: drop-shadow(5px -5px 7px rgba(0, 0, 0, 0.2));
            }
            100% { 
                transform: translate(0, 0) rotate(0deg);
                filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.3));
            }
        }
        
        .animated-emoji:hover {
            animation-play-state: paused;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5)) !important;
        }

    </style>
</head>
<body>
    <div class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <header class="page-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="m-0">
                    <i class="fas fa-gamepad me-3"></i>Бесплатные игры
                </h1>
                <a href="index.html" class="btn btn-outline-light">
                    <i class="fas fa-arrow-left me-2"></i>На главную
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="gamesContainer">
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadAndShowFreeGames() {
            return new Promise((resolve, reject) => {
                fetch('https://raw.githubusercontent.com/InJeCTrL/NeedFree/master/free_goods_detail.json')
                    .then(response => response.json())
                    .then(data => {
                        const gamesContainer = document.getElementById('gamesContainer');
                        
                        if (data.free_list && data.free_list.length > 0) {
                            gamesContainer.innerHTML = data.free_list.map(game => `
                                <div class="col">
                                    <div class="game-card h-100 d-flex flex-column">
                                        <img src="${getGameImageUrl(game[1])}" 
                                             class="game-image" 
                                             onerror="this.onerror=null; this.src='steamfreeico.png'" 
                                             alt="${game[0]}"
                                             loading="lazy">
                                        <h3 class="game-title" title="${game[0]}">${game[0]}</h3>
                                        <div class="mt-auto">
                                            <div class="game-price">Бесплатно</div>
                                            <a href="${game[1]}" target="_blank" class="btn-steam">
                                                <i class="fab fa-steam me-2"></i>В Steam
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            `).join('');
                        } else {
                            gamesContainer.innerHTML = `
                            <div class="text-center">
                            <div class="animated-emoji">🤕</div>
                            <h2 style="margin-bottom: 1rem;">Нет доступных игр</h2>
                            <p style="margin-bottom: 1.5rem;">Попробуйте обновить страницу позже</p>
                            <button onclick="window.location.reload()" class="btn btn-primary btn-lg">
                            <i class="fas fa-sync-alt me-2"></i>Обновить страницу
                         </button>
                     </div>
                 `;
                        }
                        resolve();
                    })
                    .catch(error => {
                        console.error('Ошибка при загрузке списка игр:', error);
                        const gamesContainer = document.getElementById('gamesContainer');
                        if (gamesContainer) {
                            gamesContainer.innerHTML = `
                                <div class="col-12" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9);">
                                    <div class="text-center p-4" style="max-width: 500px;">
                                        <div class="mb-4" style="font-size: 5rem;">😟</div>
                                        <h3 class="text-white mb-3">Произошла ошибка</h3>
                                        <div class="alert alert-danger mb-4">
                                            <i class="fas fa-exclamation-triangle me-2"></i>
                                            Не удалось загрузить список игр
                                        </div>
                                        <p class="text-muted mb-4">Попробуйте перезагрузить страницу или зайти позже</p>
                                        <button onclick="window.location.reload()" class="btn btn-primary btn-lg w-100">
                                            <i class="fas fa-sync-alt me-2"></i>Повторить попытку
                                        </button>
                                    </div>
                                </div>
                            `;
                        }
                        reject(error);
                    });
            });
        }

        function getGameImageUrl(steamUrl) {
            const match = steamUrl.match(/app\/(\d+)/);
            if (match && match[1]) {
                return `https://cdn.cloudflare.steamstatic.com/steam/apps/${match[1]}/header.jpg`;
            }
            return 'steamfreeico.png';
        }

        // Notification system for free games
        const FREE_GAMES_NOTIF_KEY = 'fs_free_games_notify_enabled';
        const FREE_GAMES_SEEN_KEY = 'fs_free_games_seen_ids';
        
        function isNotificationsEnabled() {
            try { return localStorage.getItem(FREE_GAMES_NOTIF_KEY) === '1'; } catch(_) { return false; }
        }
        
        function getSeenGameIds() {
            try {
                const raw = localStorage.getItem(FREE_GAMES_SEEN_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch(_) { return []; }
        }
        
        function storeSeenGameIds(ids) {
            try { localStorage.setItem(FREE_GAMES_SEEN_KEY, JSON.stringify(ids)); } catch(_) {}
        }
        
        function extractGameId(steamUrl) {
            const match = steamUrl.match(/app\/(\d+)/);
            return match ? match[1] : steamUrl;
        }
        
        function sendFreeGameNotification(newGames) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            if (!newGames || newGames.length === 0) return;
            
            const count = newGames.length;
            const titles = newGames.slice(0, 2).map(g => g[0]).join(', ');
            const body = count === 1 
                ? `Новая бесплатная игра: ${newGames[0][0]}`
                : `Новые бесплатные игры (${count}): ${titles}${count > 2 ? ' и другие' : ''}`;
                
            try {
                const notification = new Notification('FreeSteam — Бесплатные игры!', {
                    body,
                    icon: 'steamfreeico.png',
                    tag: 'freesteam-free-games',
                    requireInteraction: true
                });
                
                notification.onclick = function() {
                    window.focus();
                    notification.close();
                };
                
                // Автозакрытие через 10 секунд
                setTimeout(() => {
                    try { notification.close(); } catch(_) {}
                }, 10000);
                
            } catch(error) {
                console.error('Error sending notification:', error);
            }
        }
        
        function checkForNewGames(games) {
            if (!isNotificationsEnabled() || !games || games.length === 0) return;
            
            const currentIds = games.map(game => extractGameId(game[1]));
            const seenIds = getSeenGameIds();
            const newGameIds = currentIds.filter(id => !seenIds.includes(id));
            
            if (newGameIds.length > 0) {
                const newGames = games.filter(game => newGameIds.includes(extractGameId(game[1])));
                sendFreeGameNotification(newGames);
            }
            
            // Обновляем список просмотренных игр
            const allSeenIds = [...new Set([...seenIds, ...currentIds])];
            storeSeenGameIds(allSeenIds);
        }
        
        function enableNotifications() {
            if (!('Notification' in window)) {
                alert('Ваш браузер не поддерживает уведомления');
                return Promise.resolve(false);
            }
            
            if (Notification.permission === 'granted') {
                localStorage.setItem(FREE_GAMES_NOTIF_KEY, '1');
                return Promise.resolve(true);
            }
            
            if (Notification.permission === 'denied') {
                alert('Уведомления заблокированы в настройках браузера');
                return Promise.resolve(false);
            }
            
            return Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    localStorage.setItem(FREE_GAMES_NOTIF_KEY, '1');
                    return true;
                } else {
                    return false;
                }
            });
        }
        
        // Добавить кнопку уведомлений в заголовок
        function addNotificationButton() {
            const header = document.querySelector('.page-header .container .d-flex');
            if (header) {
                const isEnabled = isNotificationsEnabled();
                const buttonClass = isEnabled ? 'btn-success' : 'btn-outline-light';
                const buttonText = isEnabled ? 'Уведомления включены' : 'Включить уведомления';
                const iconClass = isEnabled ? 'fas fa-bell' : 'far fa-bell';
                
                const notifyButton = document.createElement('button');
                notifyButton.className = `btn ${buttonClass} me-2`;
                notifyButton.innerHTML = `<i class="${iconClass} me-2"></i>${buttonText}`;
                notifyButton.id = 'notifyToggle';
                
                notifyButton.addEventListener('click', function() {
                    if (isNotificationsEnabled()) {
                        localStorage.removeItem(FREE_GAMES_NOTIF_KEY);
                        this.className = 'btn btn-outline-light me-2';
                        this.innerHTML = '<i class="far fa-bell me-2"></i>Включить уведомления';
                    } else {
                        enableNotifications().then(success => {
                            if (success) {
                                this.className = 'btn btn-success me-2';
                                this.innerHTML = '<i class="fas fa-bell me-2"></i>Уведомления включены';
                                
                                // Показать тестовое уведомление
                                setTimeout(() => {
                                    new Notification('FreeSteam — Уведомления включены!', {
                                        body: 'Теперь вы будете получать уведомления о новых бесплатных играх',
                                        icon: 'steamfreeico.png'
                                    });
                                }, 500);
                            }
                        });
                    }
                });
                
                // Вставить кнопку перед кнопкой "На главную"
                const mainButton = header.querySelector('a[href="index.html"]');
                header.insertBefore(notifyButton, mainButton);
            }
        }
        
        // Автоматическая проверка обновлений каждые 5 минут
        function startAutoRefresh() {
            setInterval(() => {
                if (isNotificationsEnabled()) {
                    fetch('https://raw.githubusercontent.com/InJeCTrL/NeedFree/master/free_goods_detail.json')
                        .then(response => response.json())
                        .then(data => {
                            if (data.free_list && data.free_list.length > 0) {
                                checkForNewGames(data.free_list);
                            }
                        })
                        .catch(error => console.log('Auto-refresh error:', error));
                }
            }, 5 * 60 * 1000); // 5 минут
        }

        document.addEventListener('DOMContentLoaded', function() {
            const startTime = Date.now();
            const minLoadTime = 2000;
            
            // Добавить кнопку уведомлений
            addNotificationButton();
            
            loadAndShowFreeGames().then(() => {
                // Проверить на новые игры после загрузки
                fetch('https://raw.githubusercontent.com/InJeCTrL/NeedFree/master/free_goods_detail.json')
                    .then(response => response.json())
                    .then(data => {
                        if (data.free_list && data.free_list.length > 0) {
                            checkForNewGames(data.free_list);
                        }
                    })
                    .catch(error => console.log('Initial notification check error:', error));
            }).finally(() => {
                const elapsed = Date.now() - startTime;
                const remainingTime = Math.max(0, minLoadTime - elapsed);
                
                setTimeout(() => {
                    const overlay = document.querySelector('.loading-overlay');
                    if (overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                        }, 300);
                    }
                }, remainingTime);
            });
            
            // Запустить автоматические проверки
            startAutoRefresh();
        });
    </script>
</body>
</html>
