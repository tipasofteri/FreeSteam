<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1b2838">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Бесплатные игры - FreeSteam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #66c0f4;
            --bg-dark: #1b2838;
            --bg-darker: #171a21;
            --text-primary: #e9e9e9;
            --border-color: #2a3f5a;
        }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        .game-card {
            background: rgba(42, 63, 90, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s ease;
            overflow: hidden;
            height: 100%;
            margin-bottom: 1rem;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: var(--primary);
        }
        
        .game-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }
        
        .game-title {
            color: var(--primary);
            font-size: 1rem;
            font-weight: 600;
            margin: 1rem 1rem 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .game-price {
            color: #a1cd44;
            font-weight: 700;
            padding: 0 1rem 1rem;
        }
        
        .btn-steam {
            background: linear-gradient(135deg, #1b2838 0%, #2a3f5a 100%);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            border-radius: 0 0 6px 6px;
            padding: 0.75rem 0.5rem;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: block;
            font-size: 0.95rem;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-steam:hover {
            background: var(--primary);
            color: #1b2838;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(23, 26, 33, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .spinner {
            width: 150px;
            height: 150px;
            background: url('loading1.gif') center/contain no-repeat;
            position: relative;
            z-index: 10000;
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            
            .game-card {
                margin-bottom: 0.75rem;
            }
            
            .game-image {
                height: 140px;
            }
            
            .game-title {
                font-size: 0.9rem;
                margin: 0.75rem 0.75rem 0.5rem;
            }
            
            .btn-back {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
                margin: 1rem 0;
            }
            
            .page-title {
                font-size: 1.5rem;
                margin: 0.75rem 0;
            }
            
            .spinner {
                width: 120px;
                height: 120px;
            }
        }
        
        /* Very small devices */
        @media (max-width: 400px) {
            .game-image {
                height: 120px;
            }
            
            .game-title {
                font-size: 0.85rem;
                margin: 0.5rem 0.5rem 0.25rem;
            }
            
            .game-price {
                font-size: 0.9rem;
                padding: 0 0.5rem 0.75rem;
            }
        }
        
        .loading-overlay {
            background: rgba(23, 26, 33, 0.95);
        }
        
        /* Fallback in case GIF doesn't load */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .page-header {
            background: linear-gradient(135deg, #1b2838 0%, #2a3f5a 100%);
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <header class="page-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="m-0">
                    <i class="fas fa-gamepad me-3"></i>100% бесплатные игры
                </h1>
                <a href="index.html" class="btn btn-outline-light">
                    <i class="fas fa-arrow-left me-2"></i>На главную
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="gamesContainer">
            <!-- Games will be loaded here -->
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadAndShowFreeGames() {
            return new Promise((resolve, reject) => {
                fetch('https://raw.githubusercontent.com/InJeCTrL/NeedFree/master/free_goods_detail.json')
                    .then(response => response.json())
                    .then(data => {
                        const gamesContainer = document.getElementById('gamesContainer');
                        
                        if (data.free_list && data.free_list.length > 0) {
                            gamesContainer.innerHTML = data.free_list.map(game => `
                                <div class="col">
                                    <div class="game-card h-100 d-flex flex-column">
                                        <img src="${getGameImageUrl(game[1])}" 
                                             class="game-image" 
                                             onerror="this.onerror=null; this.src='steamfreeico.png'" 
                                             alt="${game[0]}"
                                             loading="lazy">
                                        <h3 class="game-title" title="${game[0]}">${game[0]}</h3>
                                        <div class="mt-auto">
                                            <div class="game-price">Бесплатно</div>
                                            <a href="${game[1]}" target="_blank" class="btn-steam">
                                                <i class="fab fa-steam me-2"></i>В Steam
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            `).join('');
                        } else {
                            gamesContainer.innerHTML = `
                                <div class="col-12 text-center py-5">
                                    <i class="fas fa-gamepad fa-3x text-muted mb-3"></i>
                                    <h4>Нет доступных игр</h4>
                                    <p class="text-muted">Попробуйте обновить страницу позже</p>
                                </div>
                            `;
                        }
                        resolve();
                    })
                    .catch(error => {
                        console.error('Ошибка при загрузке списка игр:', error);
                        const gamesContainer = document.getElementById('gamesContainer');
                        if (gamesContainer) {
                            gamesContainer.innerHTML = `
                                <div class="col-12 text-center py-5">
                                    <div class="alert alert-danger">Ошибка при загрузке списка игр</div>
                                    <button onclick="window.location.reload()" class="btn btn-primary mt-2">
                                        <i class="fas fa-sync-alt me-2"></i>Обновить
                                    </button>
                                </div>
                            `;
                        }
                        reject(error);
                    });
            });
        }

        function getGameImageUrl(steamUrl) {
            // Extract app ID from Steam URL
            const match = steamUrl.match(/app\/(\d+)/);
            if (match && match[1]) {
                return `https://cdn.cloudflare.steamstatic.com/steam/apps/${match[1]}/header.jpg`;
            }
            return 'steamfreeico.png';
        }

        // Show modal when page loads
        document.addEventListener('DOMContentLoaded', function() {
            const startTime = Date.now();
            const minLoadTime = 2000; // 2 seconds in milliseconds
            
            loadAndShowFreeGames().finally(() => {
                const elapsed = Date.now() - startTime;
                const remainingTime = Math.max(0, minLoadTime - elapsed);
                
                // Hide loading overlay after the remaining time
                setTimeout(() => {
                    const overlay = document.querySelector('.loading-overlay');
                    if (overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                        }, 300); // Fade out duration
                    }
                }, remainingTime);
            });
        });
    </script>
</body>
</html>
