name: Update FreeSteam data KZ

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-freesteam-kz
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # нужна полная история для rebase

      - name: Sync with remote before generation (rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git pull --rebase origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler (one-shot)
        run: |
          python NeedFree.py --cc kz --lang english --once
          # Move files from data/english/ to root directory
          mkdir -p data/english
          mv -f data/english/free_goods_detail_part*.json . || true
          # Rename files to include region code
          for f in free_goods_detail_part*.json; do
            mv "$f" "${f/_detail/_kz_detail}" 2>/dev/null || true
          done

      - name: Commit and push changes if any (safe rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ВНИМАНИЕ: добавляем только частичные файлы, чтобы избежать лимита GitHub (>100MB)
          # Проверяем наличие файлов в корне
          if [ -f "free_goods_kz_detail_part1.json" ]; then
            git add free_goods_kz_detail_part*.json
          else
            echo "No KZ data files found in root directory"
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            # На случай, если за время генерации пришли новые коммиты: временно убираем локальные изменения
            git stash push -u -m "auto-stash-before-rebase" || true
            git fetch origin
            git pull --rebase origin main || true
            # Вернём изменения и подготовим к коммиту
            git stash pop || true
            git add free_goods_kz_detail_part*.json || true
            git commit -m "chore: update free goods $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            # Пробуем пуш; если non-fast-forward из-за гонки — подтянем и повторим
            git push || {
              echo "Push rejected, retrying after rebase...";
              git fetch origin;
              git pull --rebase origin main || true;
              git push;
            }
          fi

      - name: Trigger Vercel deploy hook (if changes were pushed)
        if: ${{ success() }}
        run: |
          LAST_MSG="$(git log -1 --pretty=%B || true)"
          if echo "$LAST_MSG" | grep -q "chore: update free goods"; then
            curl -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Deploy hook triggered."
          else
            echo "No new commit; skipping deploy hook."
          fi
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
