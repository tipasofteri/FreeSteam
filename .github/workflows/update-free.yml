name: Update FreeSteam data

on:
  schedule:
    - cron: "0 * * * *"  # ежечасно
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-freesteam
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # нужна полная история для rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler (one-shot)
        run: |
          python NeedFree.py --cc us --lang english --once

      - name: Commit and push changes if any (with rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # подтянуть последние изменения, чтобы избежать non-fast-forward
          git fetch origin
          git pull --rebase origin main || true
          
          # ВНИМАНИЕ: не добавляем монолитный free_goods_detail.json (>100MB)
          git add free_goods_detail_part*.json data/** || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update free goods $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
