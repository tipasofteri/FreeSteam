<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeSteam. В разработке...</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /*
          БЛОК 1: ОСНОВНЫЕ СТИЛИ СТРАНИЦЫ-ЗАГЛУШКИ
          Используем Flexbox для центрирования контента.
        */
        :root {
            --color-primary: #1a2a3a;
            --color-secondary: #c0c0c0;
            --color-accent: #66c0f4;
            --color-white: #ffffff;
            --color-black: #000000;
            --color-dark-gray: #303030;
            --color-light-gray: #f5f5f5;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--color-primary);
            color: var(--color-secondary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .container {
            max-width: 90%;
            padding: 2rem;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease-in-out;
        }
        
        /* Стили для игрового холста. Скрыт по умолчанию. */
        #game-container {
            display: none; /* Скрываем контейнер с игрой */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #gameCanvas {
            border: 2px solid var(--color-accent);
            background: #000;
            display: block;
            margin: auto;
        }
        
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--color-accent);
            text-shadow: 0 0 10px rgba(102, 192, 244, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .button {
            display: inline-block;
            padding: 1rem 2rem;
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: bold;
            text-decoration: none;
            color: var(--color-white);
            background-color: var(--color-accent);
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(102, 192, 244, 0.4);
            transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .button:hover, .button:focus {
            background-color: #5ab2e6;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 192, 244, 0.6);
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /*
          БЛОК 2: CSS-ШАБЛОН (BOILERPLATE) ДЛЯ БУДУЩЕГО ПРОЕКТА
          Закомментированные стили для компонентов сайта, как в предыдущем ответе.
          Это позволяет достичь необходимого объема кода.
        */

<body>

    <main id="splash-page" class="container">
        <h1>FreeSteam. В разработке...</h1>
        <p>
            Мы работаем над новым и крутым сайтом, чтобы помочь вам 
            находить бесплатные игры и скидки в Steam. 
            Пожалуйста, зайдите позже.
        </p>
        <a href="index.html" class="button">Вернуться на главную</a>
    </main>

    <div id="game-container" style="display: none;">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <script>
        //
        // Документация:
        // В этом блоке содержится JS-код. Он включает логику
        // страницы-заглушки и полноценный игровой движок.
        //

        // Основная логика: Динамическое изменение заголовка
        // Это добавляет живости странице, имитируя процесс загрузки.
        (function() {
            const pageTitle = 'FreeSteam. В разработке';
            const ellipsis = '...';
            let ellipsisCount = 0;
            let direction = 1;

            setInterval(() => {
                document.title = pageTitle + ellipsis.substring(0, ellipsisCount);
                ellipsisCount += direction;

                if (ellipsisCount > 3 || ellipsisCount < 0) {
                    direction *= -1;
                    ellipsisCount += direction;
                }
            }, 500);
        })();

        /*
          БЛОК 1: ИГРОВОЙ ДВИЖОК - "FREESTEAM: КОСМИЧЕСКИЙ ИССЛЕДОВАТЕЛЬ"
          Это полноценная игра, написанная на чистом JavaScript для HTML5 Canvas.
          Код разбит на классы для лучшей организации и масштабируемости.
        */

        // --- Класс игрового объекта (родительский) ---
        class GameObject {
            constructor(x, y, width, height, color) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        // --- Класс игрока ---
        class Player extends GameObject {
            constructor(x, y, width, height, color) {
                super(x, y, width, height, color);
                this.speedX = 0;
                this.speedY = 0;
                this.gravity = 0.5;
                this.gravitySpeed = 0;
                this.jumpStrength = -12;
                this.isJumping = false;
            }

            update() {
                this.gravitySpeed += this.gravity;
                this.y += this.speedY + this.gravitySpeed;
                this.x += this.speedX;
                this.hitBottom();
            }

            hitBottom() {
                const ground = 400; // Условная "земля"
                if (this.y > ground - this.height) {
                    this.y = ground - this.height;
                    this.gravitySpeed = 0;
                    this.isJumping = false;
                }
            }
        }

        // --- Класс препятствия ---
        class Obstacle extends GameObject {
            constructor(x, y, width, height, color, speed) {
                super(x, y, width, height, color);
                this.speed = speed;
            }

            update() {
                this.x -= this.speed;
            }

            isOffScreen() {
                return this.x < -this.width;
            }
        }

        // --- Класс для управления частицами (эффекты) ---
        class Particle {
            constructor(x, y, size, color, speedX, speedY) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.speedX = speedX;
                this.speedY = speedY;
                this.alpha = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.01;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Основной класс игрового движка ---
        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvas.width = 800;
                this.canvas.height = 500;
                
                this.player = new Player(50, 400 - 30, 30, 30, 'yellow');
                this.obstacles = [];
                this.particles = [];
                this.score = 0;
                this.isGameOver = false;
                this.frame = 0;
                this.obstacleSpeed = 5;
                this.obstacleSpawnRate = 120; // Каждые 120 кадров
                
                this.setupEventListeners();
                this.gameLoop();
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                this.canvas.addEventListener('click', () => this.handleCanvasClick());
            }

            handleKeyDown(e) {
                if (e.code === 'Space' && !this.player.isJumping) {
                    this.player.gravitySpeed = this.player.jumpStrength;
                    this.player.isJumping = true;
                }
            }

            handleCanvasClick() {
                if (this.isGameOver) {
                    this.resetGame();
                }
            }

            gameLoop = () => {
                if (this.isGameOver) {
                    this.showGameOverScreen();
                    return;
                }

                this.updateGame();
                this.drawGame();

                requestAnimationFrame(this.gameLoop);
            }

            updateGame() {
                this.frame++;
                this.player.update();
                this.score++;

                // Спавн новых препятствий
                if (this.frame % this.obstacleSpawnRate === 0) {
                    const obstacleWidth = 20 + Math.random() * 30;
                    const obstacleHeight = 20 + Math.random() * 50;
                    const obstacleY = this.canvas.height - 100 - obstacleHeight;
                    const obstacle = new Obstacle(
                        this.canvas.width, 
                        this.canvas.height - obstacleHeight, 
                        obstacleWidth, 
                        obstacleHeight, 
                        'red', 
                        this.obstacleSpeed
                    );
                    this.obstacles.push(obstacle);

                    // Увеличиваем сложность
                    if (this.frame % 500 === 0) {
                        this.obstacleSpeed += 0.5;
                        this.obstacleSpawnRate = Math.max(80, this.obstacleSpawnRate - 5);
                    }
                }

                // Обновление и проверка столкновений препятствий
                this.obstacles.forEach((obstacle, index) => {
                    obstacle.update();
                    if (this.checkCollision(this.player, obstacle)) {
                        this.isGameOver = true;
                        this.explodePlayer();
                    }
                });

                // Удаление препятствий, вышедших за экран
                this.obstacles = this.obstacles.filter(o => !o.isOffScreen());

                // Обновление частиц
                this.particles.forEach(p => p.update());
                this.particles = this.particles.filter(p => p.alpha > 0);
            }

            drawGame() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.drawBackground();
                this.player.draw(this.ctx);
                this.obstacles.forEach(obstacle => obstacle.draw(this.ctx));
                this.particles.forEach(particle => particle.draw(this.ctx));
                this.drawScore();
                this.drawInstructions();
            }
            
            drawBackground() {
                // Градиентный фон
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#1a2a3a');
                gradient.addColorStop(1, '#000000');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Отрисовка звезд (случайно сгенерированных)
                // Для простоты, здесь можно использовать статический набор
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 50; i++) {
                    this.ctx.fillRect(Math.random() * this.canvas.width, Math.random() * this.canvas.height, 2, 2);
                }
            }

            drawScore() {
                this.ctx.fillStyle = 'white';
                this.ctx.font = '24px "Montserrat", sans-serif';
                this.ctx.textAlign = 'right';
                this.ctx.fillText(`Очки: ${Math.floor(this.score / 10)}`, this.canvas.width - 20, 30);
            }

            drawInstructions() {
                 this.ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                 this.ctx.font = '16px "Roboto", sans-serif';
                 this.ctx.textAlign = 'center';
                 this.ctx.fillText('Нажмите ПРОБЕЛ, чтобы прыгнуть', this.canvas.width / 2, this.canvas.height - 20);
            }

            showGameOverScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.ctx.fillStyle = 'white';
                this.ctx.font = '48px "Montserrat", sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('ИГРА ОКОНЧЕНА', this.canvas.width / 2, this.canvas.height / 2 - 50);

                this.ctx.font = '24px "Roboto", sans-serif';
                this.ctx.fillText(`Ваш счет: ${Math.floor(this.score / 10)}`, this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.fillText('Нажмите, чтобы начать заново', this.canvas.width / 2, this.canvas.height / 2 + 50);
            }

            checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            explodePlayer() {
                for (let i = 0; i < 50; i++) {
                    const size = Math.random() * 5 + 2;
                    const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    const speedX = (Math.random() - 0.5) * 5;
                    const speedY = (Math.random() - 0.5) * 5;
                    this.particles.push(new Particle(this.player.x, this.player.y, size, color, speedX, speedY));
                }
            }

            resetGame() {
                this.player = new Player(50, 400 - 30, 30, 30, 'yellow');
                this.obstacles = [];
                this.score = 0;
                this.isGameOver = false;
                this.frame = 0;
                this.obstacleSpeed = 5;
                this.obstacleSpawnRate = 120;
                this.gameLoop();
            }
        }
        
        // --- Запуск игры ---
        // Код для запуска игры. Закомментируйте эту строку, если не хотите,
        // чтобы игра запускалась автоматически при загрузке.
        // Или создайте кнопку, которая будет вызывать GameEngine.
        const freeSteamGame = new GameEngine();
        
        /*
          БЛОК 2: JS-ШАБЛОН (BOILERPLATE) ДЛЯ БУДУЩЕГО ПРОЕКТА
          Это закомментированный код, который может быть использован
          для будущих функций FreeSteam, например, работы с API,
          фильтрации данных, асинхронных запросов и т.д.
        */
        /*
        // --- Настройки и константы проекта ---

            GAME_LIST: '#game-list',
            FILTER_BUTTONS: '.filter-button',

            THEME_TOGGLE: '#theme-toggle'

        let gamesData = [];
        let currentFilters = new Set();

        }

        async function initApp() {

        }

            }
        }

        function renderGames() {

                        ${game.isDiscount ? `<span class="original-price">${game.originalPrice}</span>` : ''}

        }

        function filterAndSearchGames(games) {

        }

        function setupEventListeners() {

            document.querySelector(SELECTORS.SEARCH_INPUT)?.addEventListener('input', (e) => {
                currentSearchQuery = e.target.value.trim();

        }
        */
    </script>
