        /*
          Основной CSS-стиль для страницы-заглушки.
          Используем Flexbox для идеального центрирования контента.
          Применяем переменные для цветов, чтобы их было легко менять.
        */

        :root {
            /* Переменные для цветовой палитры FreeSteam */
            --color-primary: #1a2a3a;      /* Глубокий синий, как фон Steam */
            --color-secondary: #c0c0c0;   /* Светло-серый для текста */
            --color-accent: #66c0f4;      /* Ярко-голубой, акцентный цвет Steam */
            --color-white: #ffffff;       /* Белый */
            --color-black: #000000;       /* Черный */
            --color-dark-gray: #303030;   /* Темно-серый для карточек/элементов */
            --color-light-gray: #f5f5f5;  /* Светло-серый для фона */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--color-primary);
            color: var(--color-secondary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .container {
            max-width: 90%;
            padding: 2rem;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--color-accent);
            text-shadow: 0 0 10px rgba(102, 192, 244, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .button {
            display: inline-block;
            padding: 1rem 2rem;
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: bold;
            text-decoration: none;
            color: var(--color-white);
            background-color: var(--color-accent);
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(102, 192, 244, 0.4);
            transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .button:hover, .button:focus {
            background-color: #5ab2e6; /* Более темный оттенок */
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 192, 244, 0.6);
            outline: none;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

<body>

    <main class="container">
        <h1>FreeSteam. В разработке...</h1>
        <p>
            Мы работаем над новым и крутым сайтом, чтобы помочь вам 
            находить бесплатные игры и скидки в Steam. 
            Пожалуйста, зайдите позже.
        </p>
        <a href="index.html" class="button">Вернуться на главную</a>

    <script>
        //
        // Документация:
        // В этом блоке содержится JS-код. Аналогично CSS, здесь
        // есть небольшой скрипт для текущей страницы и большой

        // Основная логика: Динамическое изменение заголовка
        // Это добавляет живости странице, имитируя процесс загрузки.
        (function() {
            const pageTitle = 'FreeSteam. В разработке';
            const ellipsis = '...';
            let ellipsisCount = 0;
            let direction = 1;

            setInterval(() => {
                document.title = pageTitle + ellipsis.substring(0, ellipsisCount);
                ellipsisCount += direction;

                if (ellipsisCount > 3 || ellipsisCount < 0) {
                    direction *= -1;
                    ellipsisCount += direction;
                }
            }, 500);
        })();

        /*
          БЛОК 2: JS-ШАБЛОН (BOILERPLATE) ДЛЯ БУДУЩЕГО ПРОЕКТА
          Это закомментированный код, который может быть использован
          для будущих функций FreeSteam, например, работы с API,
          фильтрации данных, асинхронных запросов и т.д.
        */
        /*
        // --- Настройки и константы проекта ---
        const API_URLS = {
            STEAM: 'https://api.steampowered.com/',
            FREE_GAMES_API: 'https://free-games-api.vercel.app/api'
        };

        const SELECTORS = {
            GAME_LIST: '#game-list',
            FILTER_BUTTONS: '.filter-button',
            SEARCH_INPUT: '#search-input',
            THEME_TOGGLE: '#theme-toggle'
        };

        // --- Глобальные переменные состояния ---
        let gamesData = [];
        let currentFilters = new Set();
        let currentSearchQuery = '';

        // --- Вспомогательные функции ---
        // Функция для асинхронной загрузки данных с обработкой ошибок
        async function fetchData(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Ошибка при загрузке данных:', error);
                return null;
            }
        }

        // --- Основная логика приложения ---
        // Инициализация приложения
        document.addEventListener('DOMContentLoaded', initApp);

        async function initApp() {
            console.log('Приложение FreeSteam инициализировано.');
            await loadGames();
            setupEventListeners();
            renderGames();
        }

        // Загрузка данных об играх
        async function loadGames() {
            const data = await fetchData(API_URLS.FREE_GAMES_API + '/all');
            if (data) {
                gamesData = data;
                console.log('Игры успешно загружены:', gamesData.length);
            }
        }

        // Рендеринг игр на странице
        function renderGames() {
            const gameList = document.querySelector(SELECTORS.GAME_LIST);
            if (!gameList) return;
            gameList.innerHTML = ''; // Очистка списка
            const filteredGames = filterAndSearchGames(gamesData);
            
            if (filteredGames.length === 0) {
                gameList.innerHTML = '<p class="text-center">К сожалению, игр не найдено по вашему запросу.</p>';
            }

            filteredGames.forEach(game => {
                const gameCard = createGameCard(game);
                gameList.appendChild(gameCard);
            });
        }

        // Создание HTML-элемента для одной карточки игры
        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            // Внутренний HTML для карточки игры (заглушка)
            card.innerHTML = `
                <img src="${game.image}" alt="${game.title}" class="game-card-image">
                <div class="game-card-content">
                    <h3 class="game-card-title">${game.title}</h3>
                    <p class="game-card-genre">${game.genre}</p>
                    <div class="game-card-price">
                        <span class="discounted-price">${game.isFree ? 'Бесплатно' : game.discountedPrice}</span>
                        ${game.isDiscount ? `<span class="original-price">${game.originalPrice}</span>` : ''}
                        ${game.isDiscount ? `<span class="discount-badge">${game.discountPercent}%</span>` : ''}
                    </div>
                </div>
            `;
            return card;
        }

        // Фильтрация и поиск
        function filterAndSearchGames(games) {
            let result = games;
            
            // Фильтрация по тегам
            if (currentFilters.size > 0) {
                result = result.filter(game => {
                    return [...currentFilters].every(filter => game.tags.includes(filter));
                });
            }

            // Поиск по названию
            if (currentSearchQuery) {
                const query = currentSearchQuery.toLowerCase();
                result = result.filter(game => game.title.toLowerCase().includes(query));
            }

            return result;
        }

        // Настройка обработчиков событий (фильтры, поиск)
        function setupEventListeners() {
            // Обработка кликов по кнопкам фильтров
            document.querySelectorAll(SELECTORS.FILTER_BUTTONS).forEach(button => {
                button.addEventListener('click', (e) => {
                    const filterValue = e.target.dataset.filter;
                    if (currentFilters.has(filterValue)) {
                        currentFilters.delete(filterValue);
                        e.target.classList.remove('active');
                    } else {
                        currentFilters.add(filterValue);
                        e.target.classList.add('active');
                    }
                    renderGames();
                });
            });

            // Обработка ввода в поле поиска
            document.querySelector(SELECTORS.SEARCH_INPUT)?.addEventListener('input', (e) => {
                currentSearchQuery = e.target.value.trim();
                renderGames();
            });

            // Логика для переключения темы (светлая/темная)
            document.querySelector(SELECTORS.THEME_TOGGLE)?.addEventListener('click', () => {
                document.body.classList.toggle('dark-theme');
                // Сохранение предпочтения пользователя в localStorage
                const isDark = document.body.classList.contains('dark-theme');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
            
            // Загрузка темы пользователя при загрузке страницы
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            }
        }
        */
